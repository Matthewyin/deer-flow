security-zone name Trust
#
security-zone name Untrust
#
object-group ip address WEB_SERVER
 security-zone Trust
 0 network host address 10.0.0.10
 1 network subnet 10.0.1.0 24
 2 network range 10.0.2.1 10.0.2.10
#
object-group service HTTPS
 0 service tcp destination eq 443
#
rule 10 name allow_https
 source-zone Untrust
 source-zone Trust
 destination-zone Trust
 source-ip any
 source-ip TRUST_CLIENT
 destination-ip WEB_SERVER
 destination-ip WEB_SERVER_BACKUP
 service HTTPS
 service HTTPS_BACKUP
 action pass
 logging enable
#
