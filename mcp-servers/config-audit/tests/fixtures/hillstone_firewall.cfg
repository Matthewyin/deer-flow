zone "trust" vrouter "trust-vr"
zone "untrust" vrouter "untrust-vr"
address "WEB_SERVER"
 host 10.0.0.10
exit
service "HTTPS"
 tcp dst-port 443
exit
rule id 10
 name "allow_https"
 src-zone "untrust"
 dst-zone "trust"
 src-addr "WEB_CLIENT"
 src-ip 10.0.0.20
 src-range 10.0.0.30-10.0.0.40
 dst-addr "WEB_SERVER"
 service "HTTPS"
 action permit
 log enable
 disable
exit
